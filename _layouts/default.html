<!doctype html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 바로가기</a>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="AXID Lab Lecture Archive 홈">
        <span class="brand-mark" aria-hidden="true">AX</span>
        <span>
          <strong>AXID Lab</strong>
          <small>Lecture Archive</small>
        </span>
      </a>

      <nav class="site-nav" aria-label="주요 강의">
        <a href="{{ '/01_SystemAnalysisDesign/' | relative_url }}">시스템분석설계</a>
        <a href="{{ '/02_%5BEH%5DAXDXServiceDesign%26Prototype/' | relative_url }}">AX/DX 서비스 기획</a>
        <a href="{{ '/03_ManagementInformationSystem/' | relative_url }}">경영정보시스템</a>
        <a href="{{ '/05_AI%26Management/' | relative_url }}">인공지능과경영</a>
      </nav>
    </div>
  </header>

  <main id="main-content" class="shell page-shell">
    {% unless page.url == '/' %}
      <div class="breadcrumb" aria-label="현재 위치">
        <a href="{{ '/' | relative_url }}">강의 아카이브</a>
        <span aria-hidden="true">/</span>
        <span>{{ page.title | default: '강의 문서' }}</span>
      </div>
    {% endunless %}
    <article class="content">
      {{ content }}
    </article>
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <p><strong>AXID Lab</strong> · 한국공학대학교 경영학부</p>
      <p>강의자료는 교육 목적으로 제공되며, 세부 이용 조건은 저장소의 라이선스를 따릅니다.</p>
    </div>
  </footer>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BNS0CGP5SE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BNS0CGP5SE');
  </script>
</body>
</html>
